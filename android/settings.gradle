pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def file = new File('local.properties')
        if (file.exists()) { properties.load(new FileInputStream(file)) }
        def flutterSdkPath = properties.getProperty('flutter.sdk')
        if (flutterSdkPath == null) { flutterSdkPath = System.getenv('FLUTTER_ROOT') }
        return flutterSdkPath
    }()
    repositories {
        google()
        mavenCentral()
        maven {
            url "$flutterSdkPath/packages/flutter_tools/gradle"
        }
    }
}

plugins {
    id "dev.flutter.plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

include ":app"
