name: vinyl_solutions
description: "A local-first virtual vinyl record library built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  just_audio: ^0.9.40
  http: ^1.2.2
  xml: ^6.5.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  pdfx: 2.8.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Abril
      fonts:
        - asset: assets/fonts/AbrilFatface-Regular.ttf
