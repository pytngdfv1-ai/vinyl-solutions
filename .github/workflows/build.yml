name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true

      - name: Prepare signing
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.p12
            printf 'storeFile=release.p12\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=vinyl\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "Firma fija activada"
          else
            echo "::warning title=Sin firma fija::Faltan los secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD. El APK queda con firma de depuración y NO se podrá instalar encima de otro."
          fi

      - name: Build APK
        shell: bash
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} 2>&1 | tee build.log

      - name: Verify signature
        shell: bash
        run: |
          AS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$AS" verify --print-certs build/app/outputs/flutter-apk/app-release.apk 2>&1 | tee sign.log
          echo "::notice title=Firma del APK::$(grep 'SHA-256' sign.log | head -1)"

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          for f in analyze.log build.log sign.log; do
            [ -f "$f" ] || continue
            msg=$(grep -E " error •|Error|error:|FAILURE|What went wrong|Could not|e: |not found|Exception|keystore|Keystore" "$f" | head -40 || true)
            [ -n "$msg" ] || msg=$(tail -n 30 "$f")
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error title=$f::$msg"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            analyze.log
            build.log
            sign.log

      - uses: actions/upload-artifact@v4
        with:
          name: mi-biblioteca-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release (APK signed, main only)
        if: github.event_name == 'push' && env.KEYSTORE_BASE64 != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk MiBiblioteca.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MiBiblioteca.apk --title "Mi Biblioteca 1.0.${{ github.run_number }}" --notes "APK firmado. Descárgalo e instálalo encima de la versión anterior (se conserva todo)."
