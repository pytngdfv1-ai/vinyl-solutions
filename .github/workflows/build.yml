name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true

      - name: Build APK
        run: flutter build apk --release 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            analyze.log
            build.log

      - uses: actions/upload-artifact@v4
        with:
          name: vinyl-solutions-apk
          path: build/app/outputs/flutter-apk/app-release.apk
